[package]
name = "win-cap"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A small native Windows region recorder"
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "=0.62.2", features = [
  "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
  "Media_Core", "Media_MediaProperties", "Media_Transcoding", "Storage", "Storage_Streams", "Storage_FileProperties",
  "Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
  "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
